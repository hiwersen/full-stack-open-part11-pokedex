name: Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

env:
  SHOULD_DEPLOY: ${{ github.event_name == 'push' && github.ref_name == 'main' && !contains(join(github.event.commits.*.message, ', '), '#SKIP') }}

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run eslint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Trigger Deployment
        if: env.SHOULD_DEPLOY == 'true'
        run: curl --fail ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        if: env.SHOULD_DEPLOY == 'true'
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  status_notification:
    if: always()
    needs: [simple_deployment_pipeline, tag_release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify success to Discord
        if: false && env.SHOULD_DEPLOY == 'true' && !contains(needs.*.result, 'failure') && needs.simple_deployment_pipeline.result == 'success'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'success'
          title: 'Pokedex Deployed'
          description: |
            **Message:** `${{ github.event.head_commit.message }}`

            Version [`${{ needs.tag_release.outputs.new_tag }}`](${{ github.event.repository.html_url }}/releases/tag/${{ needs.tag_release.outputs.new_tag }})
            Live app: [full-stack-open-part11-pokedex.onrender.com](https://full-stack-open-part11-pokedex.onrender.com)

      - name: Notify PR failure to Discord
        if: false && contains(needs.*.result, 'failure') && github.event_name == 'pull_request'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'failure'
          nodetail: true
          title: 'PR failure notification'
          description: |
            **Event:** `${{ env.EVENT }}` ~ `${{ env.PR_NUMBER }}` ~ `${{ env.PR_TYPE }}`
            **PR title:** [`${{ env.PR_TITLE }}`](${{ env.PR_URL }})

            Base branch: [**`${{ env.BASE_BRANCH }}`**](${{ env.REPOSITORY_URL }}/tree/${{ env.BASE_BRANCH }}) <- Compare branch: [**`${{ env.COMPARE_BRANCH }}`**](${{ env.REPOSITORY_URL }}/tree/${{ env.COMPARE_BRANCH }})

            **Workflow:** [`${{ env.WORKFLOW }}`](${{ env.REPOSITORY_URL }}/actions/runs/${{ env.WORKFLOW_RUN_ID }})
            **Job:** `${{ env.JOB }}`
            **PR author:** [`${{ env.PR_AUTHOR }}`](${{ env.PR_AUTHOR_URL }})
            **PR associated commit:** [`${{ env.PR_COMMIT }}`](${{ env.REPOSITORY_URL }}/commit/${{ env.PR_COMMIT }})
            **Repository:** [`${{ env.REPOSITORY }}`](${{ env.REPOSITORY_URL }})

        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.number }}
          PR_URL: ${{ github.event.pull_request._links.html.href }}
          PR_TYPE: ${{ github.event.action }}
          COMPARE_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_URL: ${{ github.event.pull_request.user.html_url }}
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          JOB: ${{ needs.simple_deployment_pipeline.result == 'failure' && 'simple_deployment_pipeline' || 'tag_release' }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}

      - name: Notify PR merge failure to Discord
        if: false && contains(needs.*.result, 'failure') && github.event_name == 'push'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'failure'
          nodetail: true
          title: 'Failure Details'
          description: |
            **Repository:** [`${{ github.repository  }}`](${{ github.event.repository.html_url }})
            **Branch:** `${{ github.ref_name  }}`
            **Commit:** [`${{ github.event.head_commit.id }}`](${{ github.event.head_commit.url }})
            **Message:** `${{ github.event.head_commit.message }}`
            **Author:** [`${{ github.event.head_commit.author.name }}`](${{ github.server_url }}/${{ github.event.head_commit.author.username }})
            **Workflow:** `${{ github.workflow }}`
            **Job:** `${{ needs.simple_deployment_pipeline.result == 'failure' && 'simple_deployment_pipeline' || 'tag_release' }}`

            [View Workflow Run](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }})
