name: Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

env:
  SHOULD_DEPLOY: ${{ github.event_name == 'push' && github.ref_name == 'main' && !contains(join(github.event.commits.*.message, ', '), '#SKIP') }}

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run eslint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Trigger Deployment
        if: env.SHOULD_DEPLOY == 'true'
        run: curl --fail ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        if: env.SHOULD_DEPLOY == 'true'
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  status_notification:
    if: always()
    needs: [simple_deployment_pipeline, tag_release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify success to Discord
        if: env.SHOULD_DEPLOY == 'true' && !contains(needs.*.result, 'failure') && needs.simple_deployment_pipeline.result == 'success'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'success'
          title: 'Pokedex Deployed'
          description: |
            **Message:** `${{ github.event.head_commit.message }}`

            Version [`${{ needs.tag_release.outputs.new_tag }}`](${{ github.event.repository.html_url }}/releases/tag/${{ needs.tag_release.outputs.new_tag }})
            Live app: [full-stack-open-part11-pokedex.onrender.com](https://full-stack-open-part11-pokedex.onrender.com)

      - name: Notify failure to Discord
        if: false && contains(needs.*.result, 'failure')
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'failure'
          nodetail: true
          title: 'Failure Details'
          description: |
            **Repository:** [`${{ github.repository  }}`](${{ github.event.repository.html_url }})
            **Branch:** `${{ github.ref_name  }}`
            **Commit:** [`${{ github.event.head_commit.id  }}`](${{ github.event.head_commit.url }})
            **Message:** `${{ github.event.head_commit.message }}`
            **Author:** [`${{ github.event.head_commit.author.name }}`](${{ github.server_url }}/${{ github.event.head_commit.author.username }})
            **Workflow:** `${{ github.workflow }}`
            **Job:** `${{ needs.simple_deployment_pipeline.result == 'failure' && 'simple_deployment_pipeline' || 'tag_release' }}`

            [View Workflow Run](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }})

      - name: Preview failure notification
        if: contains(needs.*.result, 'failure')
        env:
          GITHUB_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REPO_URL: ${{ github.event.repository.html_url }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          USERNAME: ${{ github.event.head_commit.author.username }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ needs.simple_deployment_pipeline.result }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          echo "RepositoryL: $REPOSITORY ($REPO_URL)"
          echo "Branch: $BRANCH"
          echo "Commit: $COMMIT ($COMMIT_URL)"
          echo "Message: $MESSAGE"
          echo "Author: $AUTHOR ($GITHUB_URL / $USERNAME)"
          echo "Workflow: $WORKFLOW"
          echo "Job: $JOB"
          echo "View workflow run: ($REPO_URL /actions/runs/ $WORKFLOW_RUN)"
