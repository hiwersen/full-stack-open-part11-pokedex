name: Experimental Workflow

on:
  push:
    branches:
      - ci/experimental

env:
  GITHUB_CONTEXT: ${{ toJson(github) }}
  COMMITS: ${{ toJson(github.event.commits) }}
  COMMIT_MESSAGES: ${{ join(github.event.commits.*.messages, ', ') }}

  IS_PUSH: ${{ github.event_name == 'push' }}
  IS_CI/EXPERIMENTAL: ${{ github.ref_name == 'ci/experimental' }}

jobs:
  experimental_logs:
    runs-on: ubuntu-latest
    steps:
      - name: Log GitHub context
        run: echo "$GITHUB_CONTEXT"

      - name: Log commits
        run: echo "$COMMITS"

      - name: Log commit messages
        run: echo "$COMMIT_MESSAGES"

      - name: Check push event
        run: echo "$IS_PUS"

      - name: Check ci/experimental branch
        run: echo "$IS_CI/EXPERIMENTAL"
