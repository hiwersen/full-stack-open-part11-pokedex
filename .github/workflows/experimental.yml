name: Experimental Workflow

on:
  push:
    branches:
      - ci/experimental

jobs:
  experimental_logs:
    runs-on: ubuntu-latest
    steps:
      - name: Log GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Log commits
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: echo "$COMMITS"

      - name: Check skip commit
        env:
          SKIP_COMMIT: ${{ contains(join(github.event.commits.*.message, ', '), '#SKIP') }}
        run: |
          echo "Messages: ${{ join(github.event.commits.*.message, ', ') }}"
          echo "$SKIP_COMMIT"
