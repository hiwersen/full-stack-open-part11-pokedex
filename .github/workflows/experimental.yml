name: Experimental Workflow

on:
  push:
    branches:
      - ci/experimental

jobs:
  experimental_logs:
    runs-on: ubuntu-latest
    steps:
      - name: Log GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Log commits
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: echo "$COMMITS"

      - name: Log commit messages
        env:
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: echo "$COMMIT_MESSAGES"

      - name: Concatenate commit messages
        env:
          CONCATENATED_COMMIT_MESSAGES: ${{ join(toJson(github.event.commits.*.message), ', ') }}
        run: echo "$CONCATENATED_COMMIT_MESSAGES"

      - name: Check skip command
        env:
          SKIP: ${{ contains(join(toJson(github.event.commits.*.message), ', '), '#skip') }}
        run: echo "$SKIP"
