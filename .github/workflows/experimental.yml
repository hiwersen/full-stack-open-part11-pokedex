name: Experimental Workflow

on:
  push:
    branches:
      - ci/experimental

jobs:
  experimental_logs:
    runs-on: ubuntu-latest
    steps:
      - name: Log GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Log commits
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: echo "$COMMITS"

      - name: Check push to ci/experimental
        env:
          IS_PUSH: ${{ github.event_name == "push" }}
          IS_PUSH_TO_CI/EXPERIMENTAL: ${{ IS_PUSH && github.ref_name == "ci/experimental"L }}
        run: |
          echo "Is push to ci/experimental: $IS_PUSH_TO_CI/EXPERIMENTAL"

      - name: Check skip commit
        env:
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ', ') }}
          HAS_SKIP_COMMIT: ${{ contains(COMMIT_MESSAGES, '#SKIP') }}
        run: |
          echo "Has skip commit: $HAS_SKIP_COMMIT"
