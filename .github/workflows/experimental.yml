name: Experimental Workflow

on:
  push:
    branches:
      - ci/experimental

env:
  SHOULD_DEPLOY: ${{ github.event_name == 'push' && github.ref_name == 'ci/experimental' && !contains(join(github.event.commits.*.message, ', '), '#SKIP') }}

jobs:
  experimental_logs:
    runs-on: ubuntu-latest

    steps:
      - name: Check if it should deploy
        run: echo "$SHOULD_DEPLOY"
